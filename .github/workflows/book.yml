name: Deploy book to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'book/**'
      - 'book-template/**'
      - '.github/workflows/book.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            book-template/package-lock.json
            book/package-lock.json
      - name: Install engine dependencies
        run: npm ci
        working-directory: book-template
      - name: Install book dependencies
        run: npm ci
        working-directory: book
      - name: Build book (adoc → md → VitePress)
        run: npm run build
        working-directory: book
      - name: Install Korean fonts for PDF rendering
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: Export PDF
        run: npm run pdf
        working-directory: book
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: book/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
