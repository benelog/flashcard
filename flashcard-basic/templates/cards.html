<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Deck.Name}}: 암기 카드</title>
  <link rel="stylesheet" href="/static/style.css">
  <!-- tag::htmx-script[] -->
  <script src="/static/htmx.min.js" defer></script>
  <!-- end::htmx-script[] -->
</head>
<body>
  <h1 class="title">{{.Deck.Name}}</h1>
  <p class="nav">
    <a class="navlink" href="/">덱 목록</a>
    <a class="navlink" href="/decks/{{.Deck.ID}}/study">학습 시작</a>
  </p>
  <!-- tag::card-list[] -->
  <ul id="cards" class="list">
    {{range .Cards}}
    {{template "card-item" .}}
    {{end}}
  </ul>
  <!-- end::card-list[] -->
  <!-- tag::card-form[] -->
  <form class="row" method="post" action="/decks/{{.Deck.ID}}/cards"
        hx-post="/decks/{{.Deck.ID}}/cards" hx-target="#cards" hx-swap="beforeend">
    <input class="field" name="front" placeholder="앞면" required>
    <input class="field" name="back" placeholder="뒷면" required>
    <button class="button">카드 추가</button>
  </form>
  <!-- end::card-form[] -->
</body>
</html>
