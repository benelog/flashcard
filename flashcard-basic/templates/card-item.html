{{define "card-item"}}
<!-- tag::card-item[] -->
<li class="item">
  <span class="card-front">{{.Text}}</span>
  <span class="card-back">{{.Meaning}}</span>
  <button class="delete" hx-delete="/cards/{{.ID}}"
          hx-target="closest li" hx-swap="outerHTML"
          hx-confirm="이 카드를 지울까?">지우기</button>
</li>
<!-- end::card-item[] -->
{{end}}
