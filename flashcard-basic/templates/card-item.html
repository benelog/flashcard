{{define "card-item"}}
<!-- tag::card-item[] -->
<li class="item">
  <span class="card-front">{{.Text}}</span>
  <span class="card-back">{{.Meaning}}</span>
  <form method="post" action="/decks/{{.DeckID}}/cards/{{.ID}}/delete">
    <button class="delete">지우기</button>
  </form>
</li>
<!-- end::card-item[] -->
{{end}}
