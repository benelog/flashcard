{{/* 스토리 미리 보기 조각. 편집 화면(story_form.html)의 미리 보기 버튼이
     저장하지 않은 원문을 htmx로 보내고, 서버가 그린 이 조각을 받아 끼운다.
     실행 대상(.)은 이미 변환된 template.HTML이다. */}}
{{define "story_preview"}}
{{if .}}
<div id="story-preview-body" class="story-body tile">{{.}}</div>
<div class="row story-actions">
  <button type="button" class="btn btn-outline" data-tts-story="story-preview-body">
    {{icon "volume"}} <span class="tts-play">듣기</span><span class="tts-stop">멈춤</span>
  </button>
</div>
{{else}}
<p class="tiny faint">미리 볼 내용이 없어요.</p>
{{end}}
{{end}}
